<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 12 204 266" width="204" height="266">
  <title>Sprout AAC</title>
  <defs>
    <linearGradient id="center" x1="0.15" y1="0.9" x2="0.85" y2="0.1">
      <stop offset="0" stop-color="#A9EDC0"/>
      <stop offset="1" stop-color="#4CC977"/>
    </linearGradient>
    <linearGradient id="left" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4BB06C"/>
      <stop offset="1" stop-color="#2A7746"/>
    </linearGradient>
    <linearGradient id="right" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5DD486"/>
      <stop offset="1" stop-color="#349A57"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1A8C45" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- ground shadow -->
  <rect x="60" y="262" width="120" height="9" rx="4.5" fill="#0F5C2E" opacity="0.28"/>
  <g filter="url(#glow)">
    <!-- side leaves -->
    <ellipse cx="73" cy="140" rx="33" ry="79" fill="url(#left)" transform="rotate(-26 73 140)"/>
    <ellipse cx="167" cy="140" rx="33" ry="79" fill="url(#right)" transform="rotate(26 167 140)"/>
    <!-- centre leaf -->
    <ellipse cx="120" cy="127" rx="40" ry="105" fill="url(#center)"/>
  </g>
  <!-- veins -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.38" stroke-width="1.6">
    <path d="M42 77 L82 145"/>
    <path d="M198 77 L158 145"/>
    <path d="M120 30 V226"/>
    <path d="M92 122 L120 87 L148 122"/>
    <path d="M88 162 L120 130 L152 162"/>
  </g>
  <!-- stem -->
  <rect x="113" y="222" width="14" height="43" rx="7" fill="#0D5C2E"/>
</svg>
